<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winkelsumme im Dreieck – Parkett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rot:#e5484d; --blau:#2f7de1; --gelb:#f2c200;
    --papier:#dff0e3; --papierRand:#3d7a5a;
    --ink:#1f2a33; --muted:#5b6670; --bg:#fbfaf6; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:980px;margin:0 auto;padding:16px 14px 28px;}
  h1{font-size:clamp(20px,3.4vw,28px);margin:4px 0 2px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 12px;font-size:15px}
  .stage{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.05);overflow:hidden}
  svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .panel{display:flex;gap:14px;align-items:flex-start;padding:14px 16px 4px}
  .badge{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
  .txt h2{margin:2px 0 4px;font-size:18px}
  .txt p{margin:0 0 6px;font-size:16px;line-height:1.45}
  .controls{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px 16px;flex-wrap:wrap}
  .btns{display:flex;gap:8px}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:#eef0f2;color:var(--ink)}
  button.primary{background:var(--ink);color:#fff}
  button:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:#d5d9dd;cursor:pointer}
  .dot.on{background:var(--ink)}
  .tri{transition:transform 1.1s cubic-bezier(.6,.05,.25,1),opacity .6s;}
  .fade{transition:opacity .7s}
  .r{fill:var(--rot)} .b{fill:var(--blau)} .y{fill:var(--gelb)}
  .lbl{font:800 13px Nunito,sans-serif;fill:#22313b;text-anchor:middle;dominant-baseline:central}
  .lbl.yl{fill:#22313b}
  .big{font:800 26px Nunito,sans-serif;text-anchor:middle;dominant-baseline:central}
  .cap{font:700 18px Nunito,sans-serif;fill:var(--ink);text-anchor:middle}
  @keyframes pulse{0%{r:10;opacity:1}100%{r:34;opacity:0}}
  .pulse{animation:pulse 1.4s ease-out infinite}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 4px;color:var(--muted);font-size:14px}
  .legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
  @media (prefers-reduced-motion: reduce){.tri,.fade{transition:none}.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Posten 3: Parkett – die Winkelsumme im Dreieck</h1>
  <p class="sub">Schritt für Schritt: mit «Weiter» oder «Abspielen».</p>
  <div class="stage">
    <svg id="svg" viewBox="0 0 800 450" aria-label="Animation Parkett aus Dreiecken"></svg>
    <div class="legend">
      <span style="--c:var(--rot)">α rot</span>
      <span style="--c:var(--blau)">β blau</span>
      <span style="--c:var(--gelb)">γ gelb</span>
    </div>
    <div class="controls">
      <div class="dots" id="dots"></div>
      <div class="btns">
        <button id="prev">Zurück</button>
        <button id="play">Abspielen</button>
        <button id="next" class="primary">Weiter</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg");
const el=(n,a={},p=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};

// ---------- Geometrie ----------
const S=1.3;
const A=[0,0],B=[120*S,0],C=[40*S,-80*S];
const cen=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];
const loc=[A,B,C].map(p=>[p[0]-cen[0],p[1]-cen[1]]); // lokale Ecken (um Schwerpunkt)
const roles=["r","b","y"], names=["α","β","γ"];
const u=[120*S,0], v=[40*S,-80*S];
const O=[114,338];

function sectorPath(V,P1,P2,r){
  const d1=norm([P1[0]-V[0],P1[1]-V[1]]), d2=norm([P2[0]-V[0],P2[1]-V[1]]);
  const cr=d1[0]*d2[1]-d1[1]*d2[0];
  const s=cr>0?1:0;
  return `M${V[0]},${V[1]} L${V[0]+r*d1[0]},${V[1]+r*d1[1]} A${r},${r} 0 0 ${s} ${V[0]+r*d2[0]},${V[1]+r*d2[1]} Z`;
}
function norm(d){const l=Math.hypot(d[0],d[1]);return [d[0]/l,d[1]/l];}
function bis(V,P1,P2){const d1=norm([P1[0]-V[0],P1[1]-V[1]]),d2=norm([P2[0]-V[0],P2[1]-V[1]]);return norm([d1[0]+d2[0],d1[1]+d2[1]]);}

// ---------- Hintergrund: Blatt ----------
const sheet=el("rect",{x:70,y:80,width:660,height:290,rx:6,fill:"#fff",stroke:"#cfd6dc","stroke-dasharray":"6 6",class:"fade",opacity:0});
const sheetLbl=el("text",{x:84,y:100,class:"fade",opacity:0,style:"font:600 14px Nunito,sans-serif;fill:#8a96a0"});sheetLbl.textContent="Blatt (A4)";

// ---------- Schablone ----------
const tplG=el("g",{class:"fade",transform:`translate(400,215)`});
el("polygon",{points:loc.map(p=>p.join(",")).join(" "),fill:"#e8d9bf",stroke:"#8a6d3b","stroke-width":3,"stroke-dasharray":"8 5"},tplG);

// ---------- Dreiecke ----------
const tris=[];
const tilesSpec=[];
for(let j=0;j<2;j++)for(let i=0;i<3;i++){tilesSpec.push({i,j,down:false});tilesSpec.push({i,j,down:true});}
const scatter=[];
for(let k=0;k<12;k++){
  const col=k%4,row=Math.floor(k/4);
  const jx=((k*37)%23)-11, jy=((k*53)%19)-9;
  scatter.push({x:120+col*187+jx, y:105+row*125+jy, rot:((k*67)%360)-180});
}
tilesSpec.forEach((t,k)=>{
  const g=el("g",{class:"tri"});
  el("polygon",{points:loc.map(p=>p.join(",")).join(" "),fill:"var(--papier)",stroke:"var(--papierRand)","stroke-width":2,"stroke-linejoin":"round"},g);
  const corners=el("g",{class:"fade",opacity:0},g);
  for(let q=0;q<3;q++){
    const V=loc[q],P1=loc[(q+1)%3],P2=loc[(q+2)%3];
    el("path",{d:sectorPath(V,P1,P2,22),class:roles[q]},corners);
    const bd=bis(V,P1,P2);
    const lt=el("text",{x:V[0]+bd[0]*34,y:V[1]+bd[1]*34,class:"lbl"+(q===2?" yl":""),"font-size":12},corners);
    lt.textContent=names[q];
  }
  // Ziel im Parkett
  let c;
  if(!t.down){c=[O[0]+cen[0]+t.i*u[0]+t.j*v[0], O[1]+cen[1]+t.i*u[1]+t.j*v[1]];}
  else{
    const D=[B[0]+v[0],B[1]+v[1]];
    const dc=[(B[0]+C[0]+D[0])/3,(B[1]+C[1]+D[1])/3];
    c=[O[0]+dc[0]+t.i*u[0]+t.j*v[0], O[1]+dc[1]+t.i*u[1]+t.j*v[1]];
  }
  const labels=[...corners.querySelectorAll("text")];
  tris.push({g,corners,labels,t,tile:{x:c[0],y:c[1],rot:t.down?180:0},sc:scatter[k]});
});
// Labels in gedrehten Dreiecken aufrecht halten
function setLabelRot(tr,rot){tr.labels.forEach(l=>{l.setAttribute("transform",`rotate(${-rot} ${l.getAttribute("x")} ${l.getAttribute("y")})`);});}

// Punkt P, an dem sich sechs Dreiecke treffen: u+v
const P=[O[0]+u[0]+v[0],O[1]+u[1]+v[1]];
function worldVerts(tr){
  const r=tr.tile.rot*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);
  return loc.map(p=>[tr.tile.x+p[0]*cs-p[1]*sn,tr.tile.y+p[0]*sn+p[1]*cs]);
}
const around=[];
tris.forEach(tr=>{
  const W=worldVerts(tr);
  W.forEach((w,q)=>{ if(Math.hypot(w[0]-P[0],w[1]-P[1])<1){ around.push({tr,q,W}); } });
});

// ---------- Overlay am Punkt P ----------
const ov=el("g",{class:"fade",opacity:0});
const wedges=[];
around.forEach(a=>{
  const V=P,P1=a.W[(a.q+1)%3],P2=a.W[(a.q+2)%3];
  const path=el("path",{d:sectorPath(V,P1,P2,64),class:roles[a.q],stroke:"#fff","stroke-width":2,opacity:.95},ov);
  const bd=bis(V,P1,P2);
  const t=el("text",{x:V[0]+bd[0]*44,y:V[1]+bd[1]*44,class:"big",fill:a.q===2?"#4a3b00":"#fff"},ov);
  t.textContent=names[a.q];
  wedges.push({path,t,upper:bd[1]<0});
});
el("circle",{cx:P[0],cy:P[1],r:5,fill:"var(--ink)"},ov);

const pulseG=el("g",{class:"fade",opacity:0});
el("circle",{cx:P[0],cy:P[1],r:10,fill:"none",stroke:"var(--ink)","stroke-width":3,class:"pulse"},pulseG);
el("circle",{cx:P[0],cy:P[1],r:6,fill:"var(--ink)"},pulseG);

const halfG=el("g",{class:"fade",opacity:0});
el("line",{x1:P[0]-150,y1:P[1],x2:P[0]+150,y2:P[1],stroke:"var(--ink)","stroke-width":3,"stroke-linecap":"round"},halfG);
el("path",{d:`M${P[0]-80},${P[1]} A80,80 0 0 1 ${P[0]+80},${P[1]}`,fill:"none",stroke:"var(--ink)","stroke-width":3,"stroke-dasharray":"7 6"},halfG);

const capBox=el("g",{class:"fade",opacity:0});
el("rect",{x:470,y:18,width:310,height:54,rx:12,fill:"#fff",stroke:"#e1e5e8"},capBox);
const capT=el("text",{x:625,y:52,class:"cap","font-size":22},capBox);

// ---------- Schritte ----------
const steps=[
 {n:1,h:"Dreiecke ausschneiden",p:"Zeichne mit der Schablone 6–8 (oder mehr) <b>gleiche</b> Dreiecke auf farbiges Papier und schneide sie aus."},
 {n:1,h:"Dreiecke ausschneiden",p:"Jetzt hast du viele gleich grosse Dreiecke. Hier sind es 12. Je mehr, desto schöner wird das Parkett."},
 {n:2,h:"Ecken anmalen",p:"Male in <b>jedem</b> Dreieck die Ecken immer gleich an: <b style='color:var(--rot)'>α rot</b>, <b style='color:var(--blau)'>β blau</b>, <b style='color:#b38f00'>γ gelb</b>."},
 {n:3,h:"Lückenlos legen",p:"Lege die Dreiecke ohne Lücken auf das Blatt. Drehe sie dabei abwechselnd: eines «auf», das nächste «ab». Dann aufkleben."},
 {n:4,h:"Einen Treffpunkt suchen",p:"Suche einen Punkt, an dem sich <b>sechs</b> Dreiecke treffen. Welche Farben siehst du dort? Wie gross ist der Winkel rund um den Punkt?"},
 {n:5,h:"Rund um den Punkt: 360°",p:"Jede Farbe kommt <b>zweimal</b> vor. Zusammen bilden die sechs Winkel einen Vollwinkel: 2·(α + β + γ) = 360°."},
 {n:5,h:"Erkenntnis: 180°",p:"Oberhalb der Linie liegen genau α, β und γ – je einmal. Sie bilden einen gestreckten Winkel. Also gilt in jedem Dreieck: <b>α + β + γ = 180°</b>."}
];

const dots=document.getElementById("dots");
steps.forEach((_,i)=>{const d=document.createElement("div");d.className="dot";d.onclick=()=>{stopPlay();go(i);};dots.appendChild(d);});

let cur=-1;
function place(tr,x,y,rot,delay){
  tr.g.style.transitionDelay=delay+"ms";
  tr.g.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg)`;
  setLabelRot(tr,rot);
}
function go(i){
  cur=i;const s=steps[i];
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===steps.length-1;

  tplG.setAttribute("opacity", i===0?1:0);
  const onSheet=i>=3;
  sheet.setAttribute("opacity",onSheet?1:0); sheetLbl.setAttribute("opacity",onSheet?1:0);

  tris.forEach((tr,k)=>{
    if(i===0){ tr.g.style.opacity=0; place(tr,400,215,0,0); }
    else if(i<3){ tr.g.style.opacity=1; place(tr,tr.sc.x,tr.sc.y,tr.sc.rot,i===1?k*70:0); }
    else { tr.g.style.opacity=1; place(tr,tr.tile.x,tr.tile.y,tr.tile.rot,i===3?k*110:0); }
    tr.corners.setAttribute("opacity", i>=2?1:0);
    const isAround=around.some(a=>a.tr===tr);
    if(i>=4 && !isAround) tr.g.style.opacity=.3;
  });
  pulseG.setAttribute("opacity", i===4?1:0);
  ov.setAttribute("opacity", i>=5?1:0);
  wedges.forEach(w=>{ const o=(i===6 && !w.upper)?.18:.95; w.path.setAttribute("opacity",o); w.t.setAttribute("opacity",(i===6&&!w.upper)?.25:1); });
  halfG.setAttribute("opacity", i===6?1:0);
  capBox.setAttribute("opacity", i>=5?1:0);
  capT.textContent = i===5 ? "2·(α + β + γ) = 360°" : "α + β + γ = 180°";
}

let timer=null;
const playBtn=document.getElementById("play");
function stopPlay(){clearInterval(timer);timer=null;playBtn.textContent="Abspielen";}
playBtn.onclick=()=>{
  if(timer){stopPlay();return;}
  if(cur>=steps.length-1) go(0);
  playBtn.textContent="Pause";
  timer=setInterval(()=>{ if(cur<steps.length-1) go(cur+1); else stopPlay(); },3600);
};
document.getElementById("next").onclick=()=>{stopPlay();if(cur<steps.length-1)go(cur+1);};
document.getElementById("prev").onclick=()=>{stopPlay();if(cur>0)go(cur-1);};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("prev").click();});

go(0);
})();
</script>
</body>
</html>
